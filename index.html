.hero::after{ /* suaviza el borde inferior hacia la arena */
  content:""; position:absolute; inset:auto 0 0 0; height:14cqh;
  background:linear-gradient(to bottom, rgba(233,211,173,0), rgba(233,211,173,.0) 30%, rgba(225,200,160,.55));
  pointer-events:none;
}
.kid{position:absolute; left:5cqw; top:calc(env(safe-area-inset-top,0px) + 4cqh); width:90cqw; height:52cqh; object-fit:contain; object-position:center bottom; z-index:1}
.kid[hidden]{display:none}

.title{
  position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 14cqh);
  display:flex; flex-direction:column; align-items:center; z-index:2;
}
.sparks{position:absolute; width:76cqw; height:35cqw; left:12cqw; top:-3cqw; pointer-events:none}
.name{
  position:relative; margin:0; font-family:"Kaushan Script",cursive; font-weight:400;
  font-size:var(--nfs,17cqw); line-height:1.15; color:var(--navy); white-space:nowrap;
  -webkit-text-stroke:1.8cqw #fff; paint-order:stroke fill;
  transform:rotate(-6deg); padding:0 4cqw;
  filter:drop-shadow(0 1cqw 1.2cqw rgba(0,30,60,.3));
}
.badge{position:relative; width:54cqw; margin-top:-1cqw}
.plank{display:block; width:45cqw; margin:0 auto; transform:rotate(-4deg); filter:drop-shadow(0 1cqw 1.4cqw rgba(60,35,10,.35))}
.age{
  position:relative; display:block; width:fit-content; margin:-3.5cqw auto 0; padding:0 1.5cqw;
  font-family:"Lilita One",sans-serif; font-size:var(--afs,36cqw); line-height:.95;
  color:var(--navy); -webkit-text-stroke:2.2cqw #fff; paint-order:stroke fill;
  transform:rotate(-3deg); filter:drop-shadow(0 1.2cqw 1.2cqw rgba(0,30,60,.3));
}
.sun{position:absolute; width:16cqw; right:-3cqw; top:21cqw; filter:drop-shadow(0 .8cqw 1cqw rgba(120,70,0,.25))}
.hint{
  position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 3cqh); transform:translateX(-50%);
  z-index:2; width:11cqw; height:11cqw; border-radius:50%; background:rgba(255,255,255,.85);
  display:grid; place-items:center; color:var(--navy); text-decoration:none;
  box-shadow:0 .6cqw 2cqw rgba(0,40,70,.25); animation:bob 1.8s ease-in-out 1.2s 3;
}
.hint svg{width:55%; height:55%}
@keyframes bob{50%{transform:translate(-50%,1.5cqw)}}

.scene > *{ --u:calc(100cqw / 1080); --v:calc(115cqw / 1080); position:absolute; }
.num{
  top:calc(300*var(--v)); transform:translate(-50%,-50%);
  font-weight:600; font-size:calc(84 * var(--u)); line-height:1;
  color:var(--navy); font-variant-numeric:tabular-nums;
}
.line{
  left:calc(420 * var(--u)); color:var(--navy); white-space:nowrap; line-height:1;
  font-size:calc(var(--fs,42) * var(--u)); font-weight:600; text-transform:uppercase; word-spacing:.12em; letter-spacing:.01em;
}
.line.small{--fs:32; font-weight:500}
.line.place{text-transform:none}
.line.addr{--fs:33; font-weight:500; text-transform:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


/* ---------- Títulos, íconos y botones en CSS (nítidos) ---------- */
.c{transform:translate(-50%,-50%); white-space:nowrap; line-height:1}
.h-cap{word-spacing:.08em; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.02em; font-size:calc(var(--fs,58) * var(--u))}
.lbl{font-weight:600; color:var(--navy); text-transform:uppercase; font-size:calc(28 * var(--u)); letter-spacing:.01em}
.script{font-family:"Kaushan Script",cursive; color:var(--navy); font-size:calc(var(--fs,60) * var(--u))}
.moments{display:flex; align-items:center; gap:calc(18*var(--u)); transform:translate(-50%,-50%) rotate(-7deg)}
.moments svg{width:calc(64*var(--u)); height:calc(56*var(--u)); flex:none}
.ask{transform:translate(-50%,-50%) rotate(-3deg)}
.ico{width:calc(92*var(--u)); height:calc(92*var(--u))}

.btn{
  display:flex; align-items:center; justify-content:center; gap:calc(22*var(--u));
  box-sizing:border-box; border:calc(6*var(--u)) solid #fff; border-radius:999px; cursor:pointer; white-space:nowrap;
  font-family:"Asap Condensed","Arial Narrow",sans-serif; font-weight:700; text-transform:uppercase;
  font-size:calc(42 * var(--u)); letter-spacing:.01em; word-spacing:.18em; text-decoration:none; padding:0;
  box-shadow:0 calc(8*var(--u)) calc(16*var(--u)) rgba(30,40,50,.28), inset 0 calc(4*var(--u)) 0 rgba(255,255,255,.28);
  transition:transform .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:calc(6*var(--u)) solid var(--sun); outline-offset:calc(4*var(--u))}
.btn svg{flex:none}
.btn .chev{width:calc(34*var(--u)); height:calc(34*var(--u)); margin-left:calc(6*var(--u))}
.go{
  left:calc(290*var(--u)); top:calc(963*var(--v)); width:calc(478*var(--u)); height:calc(115*var(--v));
  color:#fff; background:linear-gradient(to bottom,#2f72ba 0%,#11518f 55%,#0a3f75 100%);
}
.go .pin{width:calc(40*var(--u)); height:calc(56*var(--u))}
.rsvp{
  left:calc(290*var(--u)); top:calc(1940*var(--v)); width:calc(532*var(--u)); height:calc(122*var(--v));
  color:var(--navy); background:linear-gradient(to bottom,#ffd95c 0%,#fbbf26 55%,#f2a90f 100%);
}
.rsvp .chk{width:calc(60*var(--u)); height:calc(60*var(--u))}
.rsvp{font-size:calc(39 * var(--u)); gap:calc(16*var(--u))}


/* ---------- Cierre: nombre y fecha ---------- */
.sign{
  position:relative; margin-top:-1px; text-align:center; color:#fff;
  padding:calc(4px + 2vw) 6vw calc(8px + 1.5vw + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,#0f4a73 0%,#0d3a60 35%,#0b2c4b 100%);
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.sign::before{ /* une el agua con la franja azul */
  content:""; position:absolute; left:0; right:0; bottom:100%; height:36px;
  background:linear-gradient(to bottom, rgba(15,74,115,0), #0f4a73); pointer-events:none;
}
.sign-name{font-family:"Kaushan Script",cursive; font-size:min(10.2vw,53px); line-height:1.1;
  text-shadow:0 3px 14px rgba(0,15,35,.5)}
.sign-rule{width:min(20vw,102px); height:2px; border-radius:9px;
  background:linear-gradient(90deg,transparent,#f7c948,transparent)}
.sign-date{font-weight:500; font-size:min(4vw,20px); letter-spacing:.03em; line-height:1.2}


/* ---------- Rayitas y olitas decorativas (SVG nítido) ---------- */
.burst{width:calc(var(--w,40)*var(--u)); height:calc(var(--h,72)*var(--u)); transform:translate(-50%,-50%); overflow:visible}
.burst.r{transform:translate(-50%,-50%) scaleX(-1)}
.wave{width:calc(var(--w,178)*var(--u)); height:calc(22*var(--u)); transform:translate(-50%,-50%); overflow:visible}
.dash{width:calc(20*var(--u)); height:calc(6*var(--u)); border-radius:9px; background:#0b4479; transform:translate(-50%,-50%)}

/* ================= Ventana de confirmación ================= */
dialog{border:0; padding:0; width:min(92vw,400px); border-radius:22px; background:#fbf3e3; color:var(--ink); box-shadow:0 20px 60px rgba(0,40,70,.4)}
dialog::backdrop{background:rgba(4,40,70,.55); backdrop-filter:blur(3px)}
.dlg{padding:26px 24px 22px}
.dlg h2{margin:0 0 4px; font-family:"Kaushan Script",cursive; font-weight:400; color:var(--navy); font-size:30px}
.dlg p{margin:0 0 18px; font-size:17px; color:#5b6670; font-weight:500}
.dlg label{display:block; font-size:16px; font-weight:600; color:var(--navy); margin:12px 0 6px}
.dlg input{width:100%; font:500 17px "Asap Condensed",sans-serif; padding:11px 13px; border-radius:12px; border:2px solid #d9c6a3; background:#fff; color:var(--ink)}
.dlg input:focus{outline:none; border-color:var(--navy)}
.stepper{display:flex; align-items:center; gap:10px}
.stepper button{width:46px;height:46px;border-radius:12px;border:2px solid #d9c6a3;background:#fff;font:600 22px "Asap Condensed";color:var(--navy);cursor:pointer}
.stepper output{min-width:40px;text-align:center;font:600 24px "Asap Condensed";color:var(--navy)}
.choice{display:flex; gap:8px; margin-top:4px}
.choice label{flex:1; margin:0}
.choice input{position:absolute; opacity:0; pointer-events:none}
.choice span{display:block; text-align:center; padding:11px 6px; border-radius:12px; border:2px solid #d9c6a3; background:#fff; font-size:17px; font-weight:500; cursor:pointer}
.choice input:checked + span{background:var(--navy); color:#fff; border-color:var(--navy)}
.choice input:focus-visible + span{outline:3px solid var(--sun)}
.actions{display:flex; gap:10px; margin-top:22px}
.actions button{flex:1; padding:13px; border-radius:999px; font:600 18px "Asap Condensed"; cursor:pointer; border:0}
.btn-send{flex:1.7!important; white-space:nowrap; background:var(--sun); color:var(--navy); box-shadow:0 4px 0 #c98f0c}
.btn-send:active{transform:translateY(2px); box-shadow:0 2px 0 #c98f0c}
.btn-cancel{background:transparent; color:#5b6670; border:2px solid #d9c6a3 !important}
.err{color:#b3261e; font-size:15px; min-height:18px; margin-top:6px}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,40px); background:var(--navy); color:#fff; padding:12px 20px; border-radius:999px; font-size:17px; opacity:0; transition:.3s; pointer-events:none; z-index:10; white-space:nowrap}
.toast.show{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

<script>
/* =========================================================
   EDITA AQUÍ LOS DATOS DE LA INVITACIÓN
   ========================================================= */
const DATOS = {
  // Foto del cumpleañero (ideal: PNG sin fondo). Déjalo vacío "" para no mostrar a nadie.
  foto: "",
  nombre: "Malkiel",
  edad: "10",
  fecha: "2026-10-24",      // AAAA-MM-DD
  horaInicio: "12:00",      // formato 24 horas
  horaFin: "",              // formato 24 horas; vacío = no se muestra
  lugar: "Villa Martina 1",
  direccion1: "Cambita",
  direccion2: "San Cristóbal",
  // Enlace de la ubicación (o texto para buscar en Google Maps)
  mapa: "https://share.google/dWaUtkcqIhE6Lkyae",
  // WhatsApp que recibe las confirmaciones: 1 + número, sin espacios ni guiones
  whatsapp: "18492632419"
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const fecha = new Date(`${DATOS.fecha}T${DATOS.horaInicio}:00-04:00`);
const [Y,M,D] = DATOS.fecha.split("-").map(Number);
const dia = new Date(Date.UTC(Y, M-1, D, 12));
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const hora12 = t => { let [h,m]=t.split(":").map(Number); const ap=h>=12?"P.M.":"A.M."; h=h%12||12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };
const textoDia = `${DIAS[dia.getUTCDay()]} ${D} de ${MESES[M-1]}`;

if (DATOS.foto){ $("kid").src = DATOS.foto; $("kid").alt = DATOS.nombre; $("kid").hidden = false; }
$("name").textContent = DATOS.nombre;
$("age").textContent = DATOS.edad;
$("dayName").textContent = DIAS[dia.getUTCDay()];
$("dayDate").textContent = `${D} de ${MESES[M-1]}`;
$("tStart").textContent = hora12(DATOS.horaInicio);
$("tEnd").textContent = DATOS.horaFin ? "a " + hora12(DATOS.horaFin) : "";
if (DATOS.horaFin) $("tStart").style.top = "calc(720*var(--v))"; else $("tStart").style.top = "calc(740*var(--v))";
$("signName").textContent = DATOS.nombre;
$("signDate").textContent = `${DIAS[dia.getUTCDay()].replace(/^./,c=>c.toUpperCase())} ${D} de ${MESES[M-1]} de ${Y}`;
$("place").textContent = DATOS.lugar;
$("addr1").textContent = DATOS.direccion1;
$("addr2").textContent = DATOS.direccion2;
document.title = `${DATOS.nombre} cumple ${DATOS.edad}`;
$("goBtn").href = /^https?:\/\//.test(DATOS.mapa) ? DATOS.mapa
  : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(DATOS.mapa);

/* Ajusta los textos para que nunca se salgan de su espacio */
function fitAll(){
  const hero = document.querySelector(".hero"), hw = hero.clientWidth;
  const name = $("name"); let n = 17; name.style.setProperty("--nfs", n+"cqw");
  while (name.getBoundingClientRect().width > hw*0.8 && n > 8){ n -= .5; name.style.setProperty("--nfs", n+"cqw"); }
  const age = $("age"); let a = DATOS.edad.length > 2 ? 28 : 36; age.style.setProperty("--afs", a+"cqw");
  while (age.scrollWidth > hw*0.5 && a > 10){ a -= 1; age.style.setProperty("--afs", a+"cqw"); }
  const u = document.querySelector(".scene").clientWidth / 1080;
  document.querySelectorAll(".fit").forEach(el=>{
    el.style.removeProperty("--fs");
    const base = parseFloat(getComputedStyle(el).getPropertyValue("--fs")) || 42;
    let fs = base; el.style.setProperty("--fs", fs);
    while (el.scrollWidth > +el.dataset.max * u && fs > 10){ fs -= 1; el.style.setProperty("--fs", fs); }
  });
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(fitAll);
addEventListener("resize", fitAll);

/* Contador */
const pad = n => String(n).padStart(2,"0");
function tick(){
  let diff = Math.max(0, fecha - new Date());
  const d = Math.floor(diff/864e5); diff %= 864e5;
  const h = Math.floor(diff/36e5); diff %= 36e5;
  const m = Math.floor(diff/6e4); const s = Math.floor(diff%6e4/1e3);
  $("d").textContent = pad(d); $("h").textContent = pad(h);
  $("m").textContent = pad(m); $("s").textContent = pad(s);
}
tick(); setInterval(tick, 1000);

/* Confirmar asistencia */
let count = 1;
const dlg = $("dlg");
$("dlgSub").textContent = `${DATOS.nombre} cumple ${DATOS.edad} el ${textoDia}, a las ${hora12(DATOS.horaInicio)}`;
$("rsvpBtn").onclick = () => { $("err").textContent=""; dlg.showModal(); setTimeout(()=>$("gName").focus(),50); };
$("cancel").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
$("minus").onclick = () => { count = Math.max(1, count-1); $("count").textContent = count; };
$("plus").onclick  = () => { count = Math.min(20, count+1); $("count").textContent = count; };
document.querySelectorAll('input[name="att"]').forEach(r => r.onchange = () => {
  const si = document.querySelector('input[name="att"]:checked').value === "si";
  $("countWrap").style.display = si ? "" : "none";
});
$("send").onclick = () => {
  const nombre = $("gName").value.trim();
  if (!nombre){ $("err").textContent = "Escribe tu nombre para confirmar."; $("gName").focus(); return; }
  const va = document.querySelector('input[name="att"]:checked').value === "si";
  const msg = va
    ? `¡Hola! Le saluda ${nombre}. Con mucho gusto le confirmo que estaré asistiendo a la celebración de los ${DATOS.edad} años de ${DATOS.nombre} el ${textoDia} a las ${hora12(DATOS.horaInicio)}. Asistiremos ${count} ${count===1?"persona":"personas"}. ¡Muchas gracias por la invitación! 🎉`
    : `¡Hola! Le saluda ${nombre}. Agradezco mucho la invitación a la celebración de los ${DATOS.edad} años de ${DATOS.nombre}, pero lamentablemente no podré asistir. ¡Le deseo un feliz cumpleaños! 🎂`;
  window.open(`https://wa.me/${DATOS.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
  dlg.close();
  const t = $("toast"); t.textContent = va ? "¡Gracias! Confirmación enviada" : "Gracias por avisar";
  t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2600);
};
</script>
